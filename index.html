<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="بطاقة التواصل الرقمية الخاصة بمحمد مومو">
  <title>Mohamed Momo | Digital Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="monogram" aria-hidden="true">MM</div>
      <p class="eyebrow">PERSONAL DIGITAL CARD</p>
      <h1 id="name">Mohamed Momo</h1>
      <p class="subtitle" id="subtitle">مرحبا بك، يسعدني التواصل معك</p>
      <div class="gold-line"></div>
      <p class="section-label">تواصل معي</p>
      <nav class="actions" aria-label="وسائل التواصل">
        <a class="action" id="call" hidden><span class="symbol">☎</span><span>اتصال هاتفي</span><span class="arrow">←</span></a>
        <a class="action whatsapp" id="whatsapp" hidden><span class="symbol">◉</span><span>WhatsApp</span><span class="arrow">←</span></a>
        <a class="action" id="instagram" hidden><span class="symbol">◎</span><span>Instagram</span><span class="arrow">←</span></a>
        <a class="action" id="facebook" hidden><span class="symbol">f</span><span>Facebook</span><span class="arrow">←</span></a>
        <a class="action" id="location" hidden><span class="symbol">⌖</span><span>موقعي</span><span class="arrow">←</span></a>
        <a class="action save" id="save-contact" hidden><span class="symbol">＋</span><span>حفظ جهة الاتصال</span><span class="arrow">←</span></a>
      </nav>
      <p class="footer">One touch. All my contacts.</p>
    </section>
    <p class="note">يمكنك تحديث بيانات هذه الصفحة لاحقاً دون تغيير بطاقة NFC أو رمز QR.</p>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
